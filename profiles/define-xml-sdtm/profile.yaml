id: https://cdisc.org/dds/profiles/define-xml/sdtm
name: dds-profile-define-xml-sdtm
title: DDS Profile - Define-XML Generation (SDTM)
description: >-
  Derived from the Define-XML profile. Tightens it for SDTM tabulation datasets:
  purpose, observation classes, roles, dataset naming, and standards.
version: 1.0.0
license: MIT

prefixes:
  dds: https://cdisc.org/dds
  ddsp: https://cdisc.org/dds/profiles/define-xml/        # parent (must match exactly)
  ddsps: https://cdisc.org/dds/profiles/define-xml/sdtm/  # this profile's namespace
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: ddsps
default_range: string

imports:
  - linkml:types
  - dds-profile-define-xml-snapshot        # layered: the PARENT SNAPSHOT is the base

annotations:
  dds.profile.baseModel: https://cdisc.org/dds/profiles/define-xml
  dds.profile.baseVersion: "1.0.0"         # pins the parent profile version
  dds.profile.status: draft
  dds.profile.useCase: Define-XML v2.1 for SDTM tabulation datasets.
  dds.profile.excludes: Analysis            # ARM is an ADaM concern

classes:

  MetaDataVersion:
    slot_usage:
      analyses:
        maximum_cardinality: 0

  ItemGroup:
    rules:
      - description: >-
          Dataset-level ItemGroups (not ValueList slices) must declare Domain,
          Structure, KeySequence, and Observation Class.
        preconditions:
          slot_conditions:
            type:
              none_of:
                - equals_string: ValueList
        postconditions:
          slot_conditions:
            name:
              pattern: "^(SUPP[A-Z][A-Z0-9]|SQAP[A-Z][A-Z0-9]|AP[A-Z][A-Z0-9]|RELREC|RELSUB|[A-Z][A-Z0-9]{1,3})$"
            purpose:
              pattern: "^Tabulation$"
            domain:
              required: true
              pattern: "^(SUPP[A-Z][A-Z0-9]|SQAP[A-Z][A-Z0-9]|AP[A-Z][A-Z0-9]|RELREC|RELSUB|[A-Z][A-Z0-9]{1,3})$"

  Item:
    slot_usage:
      role:
        range: string                          
        pattern: "^(Identifier|Topic|Timing|Grouping Qualifier|Result Qualifier|Synonym Qualifier|Record Qualifier|Variable Qualifier|Rule)$"

  Origin:
    rules:
      - description: Source limited to collected origins.
        preconditions:
          slot_conditions:
            type:
              equals_string: Collected
        postconditions:
          slot_conditions:
            source:
              any_of:
                - equals_string: Subject
                - equals_string: Investigator
                - equals_string: Vendor

      - description: Source limited to assigned and derived origins.
        preconditions:
          slot_conditions:
            type:
              any_of:
                - equals_string: Assigned
                - equals_string: Derived
        postconditions:
          slot_conditions:
            source:
              any_of:
                - equals_string: Sponsor
                - equals_string: Vendor

      - description: Source limited to protocol origins.
        preconditions:
          slot_conditions:
            type:
              equals_string: Protocol
        postconditions:
          slot_conditions:
            source:
              equals_string: Sponsor

  Standard:
    rules:
      - description: Publishing set is required for IG type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: IG
        postconditions:
          slot_conditions:
            name:
              any_of:
                - equals_string: SDTMIG
                - equals_string: SDTMIG-AP
                - equals_string: SDTMIG-MD
            version:
              pattern: "^\\d+\\.\\d+(\\.\\d+)?$"

      - description: Publishing set is required for CT type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: CT
        postconditions:
          slot_conditions:
            publishingSet:
              any_of:
                - equals_string: DEFINE-XML
                - equals_string: SDTM

  DefClass:
    slot_usage:
      name:
        maximum_cardinality: 1
        range: SdtmDefClassNameEnum
      subClasses:
        maximum_cardinality: 0

enums:

  SdtmDefClassNameEnum:
    description: Class names permitted in Define-XML v2.1.
    permissible_values:
      EVENTS: {}
      FINDINGS ABOUT: {}
      FINDINGS: {}
      INTERVENTIONS: {}
      RELATIONSHIP: {}
      SPECIAL PURPOSE: {}
      STUDY REFERENCE: {}
      TRIAL DESIGN: {}

      
