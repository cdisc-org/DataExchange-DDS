    - osb:Activity
    narrow_mappings:
    - usdm:BiomedicalConcept
    - usdm:AnalysisConcept
    - usdm:DerivationConcept
    related_mappings:
    - osb:ActivityInstance
    - osb:assm_group
    - osb:assm_subgroup
    is_a: GovernedElement
    mixins:
    - Versioned
    attributes:
      properties:
        description: Properties of the reified object, which can be other governed elements or simple
          values
        range: ConceptProperty
        multivalued: true
        inlined: true
        inlined_as_list: true
  ConceptProperty:
    description: A reified property concept that exists within the context of its containing topic concept
    close_mappings:
    - sdmx:MetaDataAttribute
    - sdmx:Concept
    narrow_mappings:
    - usdm:BiomedicalConceptProperty
    - usdm:DerivationConceptProperty
    - usdm:AnalysisConceptProperty
    related_mappings:
    - osb:sdtm_variable
    - osb:specimen
    - osb:unit_dimension
    - osb:std_unit
    - osb:laterality
    - osb:location
    - osb:position
    is_a: GovernedElement
    attributes:
      minOccurs:
        description: Minimum number of occurrences of this property in the context. Set to >0 to mandate
          some number of occurrences
        range: integer
      maxOccurs:
        description: Maximum number of occurrences of this property in the context. Leave empty for unbounded.
          Set to 0 to disable property
        range: integer
      codeList:
        description: Reference to a CodeList that constrains the values of this property
        range: CodeList
  WhereClause:
    description: A conditional element that describes the circumstances under which a containing context
      applies, linking conditions to structures where they are used
    close_mappings:
    - sdmx:AttachmentConstraint
    related_mappings:
    - fhir:StructureDefinition/context
    - qb:ObservationGroup
    - qb:Slice
    - sdmx:CubeRegion
    - sdmx:MetadataTargetRegion
    is_a: GovernedElement
    attributes:
      conditions:
        description: Logical conditions that apply in this context (combined with AND)
        range: Condition
        multivalued: true
        inlined: false
    slot_usage:
      conditions:
        required: true
        minimum_cardinality: 1
  Condition:
    description: A reusable, composable, and nestable logical construct allowing for complex expressions.
      Conditions are most useful when given a meaningful name and linked to Study Definitions.
    close_mappings:
    - odm:ConditionDef
    - usdm:Condition
    related_mappings:
    - fhir:Expression
    - qb:SliceKey
    - sdmx:DataConstraint
    - sdmx:MetaDataConstraint
    - sdmx:DataKeySet
    is_a: GovernedElement
    attributes:
      rangeChecks:
        description: Range checks that compose this condition
        range: RangeCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
      implementsCondition:
        description: Reference to a external (e.g. USDM) condition definition that this implements
      expressions:
        description: Logical expression, resolving to a boolean, that implements this condition in a specific
          context
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      operator:
        description: Logical operator for combining child conditions or range checks. Defaults to ALL
          if not specified.
        range: LogicalOperator
        required: false
      conditions:
        description: Child conditions to combine using the operator. Multiple conditions are composed
          according to the operator (AND/OR/NOT). Rearrange and nest to compose XOR, or combinations of
          AND and OR. Unless the operator is EXPRESSION, in which case the formalExpression is used instead.
          Use OID references to reuse conditions defined elsewhere.
        range: Condition
        multivalued: true
        inlined: false
  RangeCheck:
    description: A validation element that performs a simple comparison check between a referenced item's
      value and specified values, resolving to a boolean result
    related_mappings:
    - qb:SliceKey
    - sdmx:DataKey
    attributes:
      comparator:
        description: The type of comparison to be performed
        range: Comparator
      checkValues:
        description: Values to compare against
        multivalued: true
        inlined: true
        inlined_as_list: true
      item:
        description: Reference to the Item element whose value is being checked. If not specified, check
          applies to the enclosing context
        any_of:
        - range: Item
        - range: Dimension
        - range: Measure
        - range: DataAttribute
      softHard:
        description: Indicates whether a validation check is an error ("Hard") or a warning ("Soft")
        range: SoftHard
      expressions:
        description: A formal expression for complex checks
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      operator:
        description: Logical operator for combining child conditions or range checks. Defaults to ALL
          if not specified.
        range: LogicalOperator
        required: false
    slot_usage:
      item:
        range: Item
  FormalExpression:
    description: A computational element that defines the execution of a data derivation within a specific
      context
    exact_mappings:
    - odm:FormalExpression
    - odm:FormalExpressionRef
    - fhir:Expression
    is_a: IdentifiableElement
    attributes:
      context:
        description: The specific context within the containing element to which this formal expression
          applies.
        exact_mappings:
        - fhir:Expression/language
      expression:
        description: The actual text of the formal expression (renamed from 'code' for disambiguation).
        aliases:
        - code
        required: true
      returnType:
        description: Return type of the expression
      parameters:
        description: Parameters used in the expression
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      returnValue:
        description: Return value details
        range: ReturnValue
      externalCodeLibs:
        description: External code libraries referenced
        range: Resource
        multivalued: true
  Method:
    description: 'A reusable computational procedure that describes how to derive values and can be referenced
      by Items.

      Analysis and Derivation concepts can be implemented by a Method. Properties can be referenced by
      Parameters in its expressions.'
    exact_mappings:
    - odm:MethodRef
    - odm:MethodDef
    close_mappings:
    - fhir:Expression
    - omop:Transformation
    is_a: GovernedElement
    attributes:
      type:
        description: The type of method e.g. Computation, Imputation, Transformation.
        range: MethodType
      expressions:
        description: Formal expressions used by this method
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      documents:
        description: Reference to a document that describes this method in detail.
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      implementsConcept:
        description: Reference to a specific concept that this Method implements.
        range: ReifiedConcept
        inlined: false
  SourceItem:
    description: A data source that provides the origin of information for an item
    attributes:
      item:
        description: Reference to an item
        range: Item
        inlined: false
      document:
        description: Reference to an external document
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      resource:
        description: Path to a resource (e.g. File, FHIR datasource) that is the source of this item
        any_of:
        - range: Resource
        - range: string
        multivalued: true
        inlined: false
      coding:
        description: A coding that describes the source of the item
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true
  Parameter:
    description: A variable element that describes an input used in a formal expression
    is_a: IdentifiableElement
    attributes:
      dataType:
        description: The data type of the parameter.
        range: DataType
      codeList:
        description: A list of allowed values for the parameter.
        range: CodeList
        multivalued: true
      value:
        description: A specific bound value for the parameter.
      defaultValue:
        description: A default value for the parameter.
      items:
        description: A list of item dependencies for the parameter.
        any_of:
        - range: Item
        - range: Dimension
        - range: Measure
        - range: DataAttribute
        multivalued: true
        inlined: false
      conceptProperty:
        description: Reference to a specific concept property that this parameter represents or modifies.
        range: ConceptProperty
        multivalued: true
        inlined: false
      applicableWhen:
        description: 'References to different situations that define when this parameter is applicable
          or required in the containing expression. Multiple whereClauses are combined with OR logic:
          the parameter applies if ANY referenced WhereClause matches.

          Within each WhereClause, conditions are combined with AND logic. Example: applicableWhen: ["WC.ADULT",
          "WC.PEDIATRIC"] means the parameter is needed when (all conditions in WC.ADULT are true) OR
          (all conditions in WC.PEDIATRIC are true).'
        range: WhereClause
        multivalued: true
        inlined: false
      conditions:
        description: 'Validation conditions that constrain this parameter''s value beyond controlled terminology.
          Multiple conditions are combined with AND logic: all must be satisfied. Use these for parameter
          validation rules, distinct from applicableWhen which determines if the parameter is needed at
          all.

          Example: A parameter AGE might have conditions ensuring it''s >= 0 and <= 120. or conditions
          might make up part of a componsed expression.'
        range: Condition
        multivalued: true
        inlined: false
      required:
        description: Indicates whether this parameter must be provided when the containing expression
          is evaluated (technical constraint).
        range: boolean
        ifabsent: 'False'
    slot_usage:
      items:
        range: Item
  ReturnValue:
    description: An output specification that defines the details of what a formal expression returns
    is_a: IdentifiableElement
    attributes:
      dataType:
        description: The data type of the return value.
        range: DataType
      valueList:
        description: A list of possible return values.
        multivalued: true
  Origin:
    description: A provenance element that describes the source of data for an item
    attributes:
      type:
        description: 'The type of origin: Assigned, Collected, Derived, Protocol, Predecessor, Not Available,
          or Other.'
        range: OriginType
      source:
        description: The source of the data, such as Investigator, Sponsor, Subject, or Vendor.
        range: OriginSource
      sourceItems:
        description: Source items for this origin
        range: SourceItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      documents:
        description: Reference to a document that describes this origin in detail.
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      type:
        required: true
        range: DefineOriginType
      source:
        required: true
  SiteOrSponsorComment:
    description: A feedback element that contains comments from a site or sponsor, distinct from the general
      Comment class
    is_a: GovernedElement
    attributes:
      text:
        description: The comment text.
        any_of:
        - range: string
        - range: TranslatedText
        required: true
      sourceType:
        description: who made the comment, such as Investigator, Sponsor.
        range: OriginSource
      source:
        description: ID of the comment provider
        any_of:
        - range: User
        - range: Organization
        - range: string
  User:
    description: An entity that represents information about a specific user of a clinical data collection
      or data management system
    exact_mappings:
    - odm:User
    broad_mappings:
    - prov:Agent
    is_a: IdentifiableElement
    attributes:
      userType:
        description: User's role in the study.
        range: UserType
      userName:
        description: The username of the user.
      fullName:
        description: The full name of the user.
      organization:
        description: The organization the user belongs to.
        close_mappings:
        - prov:actedOnBehalfOf
        range: Organization
  Organization:
    description: An entity that represents organizational information, such as a site or sponsor
    exact_mappings:
    - odm:Organization
    - usdm:Organization
    - sdmx:Organisation
    broad_mappings:
    - prov:Agent
    is_a: IdentifiableElement
    attributes:
      role:
        description: The role of the organization in the study.
      type:
        description: The type of organization (e.g., site, sponsor, vendor).
        range: OrganizationType
      location:
        description: The physical location of the organization.
      address:
        description: The address of the organization.
      partOfOrganization:
        description: Reference to a parent organization if this organization is part of a larger entity.
        range: Organization
  Standard:
    description: A collection element that groups related standards within a specific context, used for
      defining CDISC implementation guides and controlled terminologies
    exact_mappings:
    - odm:Standard
    is_a: IdentifiableElement
    attributes:
      name:
        description: Name of a standard
        range: StandardName
      type:
        description: Type of a standard
        range: StandardType
      publishingSet:
        description: Publishing Set of a Controlled Terminology
        range: PublishingSet
      version:
        description: Version of an Implementation Guide or of a Controlled Terminology
      status:
        description: Status of an Implementation Guide or of a Controlled Terminology
        range: StandardStatus
  Resource:
    description: An external reference that serves as the source for a Dataset, ItemGroup, or Item
    close_mappings:
    - odm:Resource
    is_a: IdentifiableElement
    mixins:
    - Versioned
    attributes:
      resourceType:
        description: Type of resource (e.g.,  "ODM", "HL7-FHIR", "HL7-CDA", "HL7-v2", "OpenEHR-extract")
        required: false
      attribute:
        description: Field provided by the Name attribute where the data or information can be obtained.
          Examples are "valueQuantity.value" or "valueQuantity.unit".
      selection:
        description: Machine-executable instructions for selecting data from the resource.
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
  DocumentReference:
    description: A comprehensive reference element that points to an external document, combining elements
      from ODM and FHIR
    is_a: IdentifiableElement
    mixins:
    - Versioned
    attributes:
      title:
        description: Document title
        range: string
      leafID:
        description: Leaf identifier for document reference in Define-XML
      pages:
        description: Reference to specific pages in a PDF document
        range: integer
        multivalued: true
        required: false
      relationship:
        description: Relationship to the referencing entity
        required: false
  Timing:
    description: A temporal element that describes the timing of an event or occurrence, which can be
      absolute, relative, or nominal
    exact_mappings:
    - usdm:Timing
    broad_mappings:
    - fhir:Timing
    narrow_mappings:
    - omop:Observation_period
    - omop:Drug_era
    - omop:Condition_era
    - omop:Procedure_era
    - fhir:Period
    - fhir:Age
    - fhir:Duration
    is_a: IdentifiableElement
    attributes:
      type:
        description: 'The type of timing: Fixed, Before (Relative), or After (Relative).'
        range: TimingType
        required: true
      isNominal:
        description: Indicates whether the timing is nominal (event-based) or not.
        range: boolean
      value:
        description: The value of the timing, which can be a date/time, duration, or event reference.
        required: true
      relativeTo:
        description: Reference to the event or occurrence that this timing is relative to.
        range: NominalOccurrence
      relativeFrom:
        description: Reference to the event or occurrence that this timing is relative to.
        range: NominalOccurrence
      windowLower:
        description: Start date/time of the timing
        range: datetime
      windowUpper:
        description: End date/time of the timing
        range: datetime
      recalled:
        description: Indicates whether the timing is recalled or not (recalled timings are less reliable).
        range: boolean
      frequency:
        description: Frequency. Use dose frequency terminology e.g. "BID" if applicable.
      imputation:
        description: The imputation method used for the Timing.
        range: Method
  NominalOccurrence:
    description: An event element that represents occurrences such as planned or unplanned encounters
      or adverse events
    narrow_mappings:
    - usdm:ScheduledInstance
    - usdm:Encounter
    - usdm:InterCurrentEvent
    - fhir:PlanDefinition/action
    - fhir:ActivityDefinition
    - fhir:Encounter
    - fhir:AdverseEvent
    - omop:Visit_occurrence
    - omop:Condition_occurrence
    - omop:Procedure_occurrence
    related_mappings: null
    is_a: GovernedElement
    attributes:
      timing:
        description: A named event reference, that can nest further named timing references.
        range: Timing
        required: true
      event:
        description: The ID of the event in a Schedule.
        required: false
      condition:
        description: A condition that must be met for this occurrence to be valid.
        range: Condition
        multivalued: true
enums:
  AliasPredicate:
    description: An enumeration that defines permissible values for the relationship between an element
      and its alias
    from_schema: linkml:AliasPredicateEnum
    permissible_values:
      EXACT_SYNONYM:
        description: Codes have identical meaning e.g. "diabetes mellitus" and "DM"
        meaning: skos:exactMatch
      RELATED_SYNONYM:
        description: Codes are related but not equivalent e.g. "diabetes" and "mellitus"
        meaning: skos:relatedMatch
      BROAD_SYNONYM:
        description: Target is broader than source e.g. "diabetes" is broader than "type 2 diabetes"
        meaning: skos:broaderMatch
      NARROW_SYNONYM:
        description: Target is narrower than source e.g. "type 2 diabetes" is narrower than "diabetes"
        meaning: skos:narrowerMatch
  Comparator:
    description: An enumeration that defines the types of comparison operations available for a RangeCheck
    permissible_values:
      LT:
        description: Less than
      LE:
        description: Less than or equal
      GT:
        description: Greater than
      GE:
        description: Greater than or equal
      EQ:
        description: Equal
      NE:
        description: Not equal
      IN:
        description: In set
      NOTIN:
        description: Not in set
  UserType:
    description: An enumeration that defines the types of users in a clinical data collection or management
      system
    permissible_values:
      Sponsor: null
      Investigator: null
      Lab: null
      Other: null
      Subject: null
      Monitor: null
      Data analyst: null
      Care provider: null
      Assessor: null
  OrganizationType:
    description: An enumeration that defines the types of organizations involved in clinical research
    permissible_values:
      Sponsor: null
      Site: null
      CRO: null
      Lab: null
      TechnologyProvider: null
      Other: null
  SoftHard:
    description: An enumeration that indicates whether a validation check should be treated as an error
      or a warning
    permissible_values:
      Soft:
        description: Warning
      Hard:
        description: Error
  MethodType:
    description: An enumeration that defines the types of computational methods available for data processing
    permissible_values:
      Computation:
        description: Mathematical computation using values of other items.
      Imputation:
        description: Assignment of a value based on a estimation (imputation) procedure.
      Transformation:
        description: Transformation of the item's value according to a standard algorithm, such as a change
          in units.
      Analysis:
        description: Creation of analysis results dataset.
      Display:
        description: Creation of rendered output for display.
  DataType:
    description: An enumeration that defines the fundamental data types available for items
    permissible_values:
      text:
        description: Character text with no length restriction.
      integer:
        description: Integer numbers.
      float:
        description: Floating-point numbers (decimals).
      date:
        description: Calendar date.
      time:
        description: Time of day.
      datetime:
        description: Calendar date and time of day.
      boolean:
        description: Logical values (true/false).
      double:
        description: Double-precision floating-point numbers.
      hex:
        description: Hexadecimal number.
      base64:
        description: Base-64 encoded binary data.
      hexBinary:
        description: Hexadecimal encoded binary data.
      durationDatetime:
        description: ISO 8601 duration value representing a span of time (e.g., P1Y2M3DT4H5M6S).
  OriginSource:
    description: An enumeration that defines the sources of data origin Values sourced from NCI Thesaurus
      subset C170450.
    permissible_values:
      Investigator:
        text: Investigator
        meaning: NCIT:C25936
      Sponsor:
        text: Sponsor
        meaning: NCIT:C70793
      Subject:
        text: Subject
        meaning: NCIT:C41189
      Vendor:
        text: Vendor
        meaning: NCIT:C68608
  ItemGroupType:
    description: An enumeration that defines the roles of an item group within a specific context
    permissible_values:
      DataCube:
        description: A Data Structure Definition for an Analysis Data Cube of dimensions, measures, and
          attributes.
      Table:
        description: A simple table or data frame.
      Object:
        description: An object or profile of a FHIR resource.
      DatasetSpecialization:
        description: A data specialization of a concept.
      ValueList:
        description: A list of topic-specific items for a specific column (from Define-XML).
      Section:
        description: A section of a form.
      Form:
        description: A data collection form.
  TimingType:
    description: An enumeration that defines CDISC timing type values indicating the temporal relationship
      of an observation to a reference point
    permissible_values:
      After:
        text: After
        meaning: NCIT:C201356
      Before:
        text: Before
        meaning: NCIT:C201357
      Fixed:
        text: Fixed
        meaning: NCIT:C201358
