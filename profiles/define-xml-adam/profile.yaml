id: https://cdisc.org/dds/profiles/define-xml/adam
name: dds-profile-define-xml-adam
title: DDS Profile - Define-XML Generation (ADaM)
description: >-
  Derived from the Define-XML profile. Tightens it for ADaM analysis datasets:
  purpose, dataset classes, naming, origin types, and analysis results metadata.
version: 1.0.0
license: MIT

prefixes:
  dds: https://cdisc.org/dds
  ddsp: https://cdisc.org/dds/profiles/define-xml/
  ddspa: https://cdisc.org/dds/profiles/define-xml/adam/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: ddspa
default_range: string

imports:
  - linkml:types
  - dds-profile-define-xml-snapshot

annotations:
  dds.profile.baseModel: https://cdisc.org/dds/profiles/define-xml
  dds.profile.baseVersion: "1.0.0"
  dds.profile.status: draft
  dds.profile.useCase: Define-XML v2.1 for ADaM analysis datasets, including analysis results metadata.

classes:

  MetaDataVersion:            
    slot_usage:
      annotatedCRFs:
        maximum_cardinality: 0

  ItemGroup:
    rules:
      - description: >-
          Dataset-level ItemGroups (not ValueList slices) must declare Domain,
          Structure, KeySequence, and Observation Class.
        preconditions:
          slot_conditions:
            type:
              none_of:
                - equals_string: ValueList
        postconditions:
          slot_conditions:
            name:
              pattern: "^AD[A-Z0-9]{1,6}$"
            purpose:
              pattern: "^Analysis$"
            domain:
              maximum_cardinality: 0
            isReferenceData:
              maximum_cardinality: 0 
            observationClass:
            observationClass:
              range: DefClassNameEnum

  Item:
    slot_usage:
      role:
        maximum_cardinality: 0                 # Role is not used for ADaM
      roleCodeList:
        maximum_cardinality: 0
      isNonStandard:
        maximum_cardinality: 0                 # IsODMStandard (standard, isNonStandard) is not used for ADaM

  Origin:
    slot_usage:
      type:
        range: AdamOriginType                  # narrows the parent's DefineOriginType
    rules:
      - description: Source limited to assigned and derived origins.
        preconditions:
          slot_conditions:
            type:
              any_of:
                - equals_string: Assigned
                - equals_string: Derived
        postconditions:
          slot_conditions:
            source:
              range: AssignedDerivedSource

  Standard:
    rules:
      - description: Publishing set is required for IG type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: IG
        postconditions:
          slot_conditions:
            name:
              range: AdamStandardName

      - description: Publishing set is required for CT type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: CT
        postconditions:
          slot_conditions:
            publishingSet:
              range: AdamPublishingSet

  Analysis:
    slot_usage:
      inputData:
        required: true
        minimum_cardinality: 1                 

enums:
  AdamOriginType:
    description: Origin types permitted in an ADaM Define-XML (no Collected).
    permissible_values:
      Assigned:    { meaning: NCIT:C170547 }
      Derived:     { meaning: NCIT:C170549 }
      Predecessor: { meaning: NCIT:C170550 }

  AdamStandardName:
    description: Standards that may appear in an ADaM Define-XML.
    permissible_values:
      ADaMIG: {}
      CDISC/NCI: {}

  AdamPublishingSet:
    description: Publishing sets that may appear in an ADaM Define-XML.
    permissible_values:
      DEFINE-XML: {}
      ADaM: {}

  AssignedDerivedSource:
    description: Types of assigned and derived origins.
    permissible_values:
      Sponsor: { meaning: NCIT:C70793 }

  DefClassNameEnum:
    description: Class names permitted in Define-XML v2.1.
    permissible_values:
      BASIC DATA STRUCTURE: {}
      MEDICAL DEVICE BASIC DATA STRUCTURE: {}
      OCCURRENCE DATA STRUCTURE: {}
      SUBJECT LEVEL ANALYSIS DATASET: {}
      ADAM OTHER: {}
      DEVICE LEVEL ANALYSIS DATASET: {}
      MEDICAL DEVICE OCCURRENCE DATA STRUCTURE: {}
      REFERENCE DATA STRUCTURE: {}


