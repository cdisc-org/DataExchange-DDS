id: https://cdisc.org/dds/profiles/define-xml
name: dds-profile-define-xml
title: DDS Profile - Define-XML Generation
description: >-
  Constrains DDS to the content required to generate Define-XML v2.1.
version: 1.0.0
license: MIT

prefixes:
  dds: https://cdisc.org/dds
  ddsp: https://cdisc.org/dds/profiles/define-xml/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: ddsp
default_range: string

imports:
  - linkml:types
  - dds

annotations:
  dds.profile.baseModel: https://cdisc.org/dds
  dds.profile.baseVersion: "1.0.0"
  dds.profile.status: draft
  dds.profile.useCase: Generation of Define-XML v2.1 documents.
  dds.profile.excludes: >-
    DataStructureDefinition, Dataflow, Dataset, SeriesKey, GroupKey,
    DatasetKey, Dimension, Measure, DataAttribute, ComponentList,
    DataProduct, DataService, Distribution, Display, ConceptProperty

classes:

  MetaDataVersion:            # base tree_root retained as profile root
    slot_usage:
      name:                           # from Labelled
        required: true
      coding:                         # from Labelled
        maximum_cardinality: 0
      mandatory:                      # from Governed
        maximum_cardinality: 0
      comments:                       # from Governed
        maximum_cardinality: 1
      purpose:                        # from Governed
        maximum_cardinality: 0
      wasDerivedFrom:                 # from Governed
        maximum_cardinality: 0
      itemGroups:                          
        required: true
        minimum_cardinality: 1
      items:                               
        minimum_cardinality: 0
      codings:
        maximum_cardinality: 0
      concepts:
        maximum_cardinality: 0
      relationships:
        maximum_cardinality: 0
      standards:                      
        minimum_cardinality: 1        # required only conditionally; see rules below
      annotatedCRFs:
        multivalued: false
      resources:
        maximum_cardinality: 0
      dataProducts:
        maximum_cardinality: 0
      displays:
        maximum_cardinality: 0

    rules:
      - description: >-
          Submission context requires at least one Standard to be declared;
          non-submission (Other) contexts may omit it despite the minimum
          cardinality of 1 above (which only bites once standards is present).
        preconditions:
          slot_conditions:
            context:
              equals_string: Submission
        postconditions:
          slot_conditions:
            standards:
              required: true

  Identifiable:
    slot_usage:
      OID:                            
        required: true
      uuid:
        maximum_cardinality: 0

  Labelled:
    slot_usage:
      label:
        maximum_cardinality: 0
      aliases:
        maximum_cardinality: 0

  Governed:
    slot_usage:
      wasDerivedFrom:
        any_of:
          - range: Item
          - range: ItemGroup
          - range: CodeList
      siteOrSponsorComments:
        maximum_cardinality: 0
      lastUpdated:
        maximum_cardinality: 0
      owner:
        maximum_cardinality: 0

  ODMFileMetadata:
    slot_usage:
      fileOID:                        
        required: true
      odmVersion:
        pattern: "^1\\.3\\.2$"
      fileType:
        pattern: "^Snapshot$"
      context:
        required: true
        pattern: "^(Other|Submission)$"
      defineVersion:
        required: true
        pattern: "^2\\.1(\\.\\d+)?$"

  StudyMetadata:
    slot_usage:
      studyOID:                       
        required: true
      studyName:                      
        required: true
      studyDescription:               
        required: true
      protocolName:                   
        required: true

  ItemGroup:
    slot_usage:
      name:
        required: false          # required only for dataset-level groups; see rules below
      description:
        required: false          # required only for dataset-level groups; see rules below
      coding:
        maximum_cardinality: 0
      mandatory:
        maximum_cardinality: 0
      comments:
        maximum_cardinality: 1
      purpose:
        range: string
        required: false          # required only for dataset-level groups; see rules below
      version:
        maximum_cardinality: 0
      href:
        maximum_cardinality: 0
      profile:
        maximum_cardinality: 0
      security:
        maximum_cardinality: 0
      authenticator:
        maximum_cardinality: 0
      validityPeriod:
        maximum_cardinality: 0
      structure:
        range: string
        required: false          # required only for dataset-level groups; see rules below
      keySequence:
        required: false          # required only for dataset-level groups; see rules below
        minimum_cardinality: 1
      implementsConcept:
        maximum_cardinality: 0
      applicableWhen:
        maximum_cardinality: 0
      observationClass:
        required: false          # required only for dataset-level groups; see rules below

    rules:
      - description: >-
          Value-list slices (type: ValueList).
        preconditions:
          slot_conditions:
            type:
              equals_string: ValueList
        postconditions:
          slot_conditions:
            name:
              required: false
            description:
              required: false
            comments:
              maximum_cardinality: 0
            purpose:
              maximum_cardinality: 0
            wasDerivedFrom:
              any_of:
                - range: Item
            standard:
              maximum_cardinality: 0
            isNonStandard:
              maximum_cardinality: 0
            domain:
              maximum_cardinality: 0
            structure:
              maximum_cardinality: 0
            isReferenceData:
              maximum_cardinality: 0
            keySequence:
              maximum_cardinality: 0
            slices:
              maximum_cardinality: 0
            hasNoData:
              maximum_cardinality: 0
            observationClass:
              maximum_cardinality: 0

      - description: >-
          Dataset-level ItemGroups (not ValueList slices) must declare
          Name, Description, Purpose, Structure, KeySequence, and
          Observation Class.
        preconditions:
          slot_conditions:
            type:
              none_of:
                - equals_string: ValueList
        postconditions:
          slot_conditions:
            name:
              required: true
            description:
              required: true
            purpose:
              required: true
            structure:
              required: true
            keySequence:
              required: true
              minimum_cardinality: 1
            observationClass:
              required: true
            wasDerivedFrom:
              maximum_cardinality: 0

  Item:
    slot_usage:
      name:                           # from Labelled
        required: true
      coding:                         # from Labelled
        maximum_cardinality: 0
      mandatory:                      # from Governed
        required: true                
      comments:                       # from Governed
        maximum_cardinality: 1
      purpose:                        # from Governed
        maximum_cardinality: 0
      wasDerivedFrom:                 # from Governed
        maximum_cardinality: 0
      crfCompletionInstructions:      # IsODMItem
        maximum_cardinality: 0
      cdiscNotes:                     # IsODMItem
        maximum_cardinality: 0
      implementationNotes:            # IsODMItem 
        maximum_cardinality: 0
      collectionExceptionCondition:   # IsODMItem
        maximum_cardinality: 0
      preSpecifiedValue:              # IsODMItem  
        maximum_cardinality: 0
      standard:                       # IsODMStandard
        maximum_cardinality: 0        
      dataType:
        range: DefineDataType         
      rangeChecks:
        maximum_cardinality: 0        
      conceptProperty:
        maximum_cardinality: 0

    rules:
      - description: >-
          Define-XML v2.1 requires Length for text, integer, and float items.
          (Rule support varies by generator/validator; treat as a documented
          check where the toolchain cannot enforce it.)
        preconditions:
          slot_conditions:
            dataType:
              any_of:
                - equals_string: text
                - equals_string: integer
                - equals_string: float
        postconditions:
          slot_conditions:
            length:
              required: true

      - description: >-
          Define-XML v2.1 requires SignificantDigits for float items.
        preconditions:
          slot_conditions:
            dataType:
              equals_string: float
        postconditions:
          slot_conditions:
            significantDigits:
              required: true

  Origin:
    slot_usage:
      type:
        required: true
        range: DefineOriginType       
    rules:
      - description: Predecessor origins must identify their source item(s).
        preconditions:
          slot_conditions:
            type:
              equals_string: Predecessor
        postconditions:
          slot_conditions:
            sourceItems:
              required: true
              minimum_cardinality: 1

      - description: Source required.
        preconditions:
          slot_conditions:
            type:
              any_of:
                - equals_string: Collected
                - equals_string: Assigned
                - equals_string: Derived
                - equals_string: Protocol
        postconditions:
          slot_conditions:
            source:
              required: true

  Method:
    slot_usage:
      type:
        required: true
        range: DefineMethodType
      implementsConcept:
        maximum_cardinality: 0

  WhereClause:
    slot_usage:
      conditions:
        required: true
        minimum_cardinality: 1

  RangeCheck:
    slot_usage:
      item:
        range: Item                   

  Condition:
    slot_usage:
      implementsCondition:
        maximum_cardinality: 0

  FormalExpression:
    slot_usage:
      returnType:
        maximum_cardinality: 0
      parameters:
        maximum_cardinality: 0
      returnValue:
        maximum_cardinality: 0
      externalCodeLibs:
        maximum_cardinality: 0

  CodeList:
    slot_usage:
      dataType:
        range: DefineCodeListDataType
      externalCodeList:
        maximum_cardinality: 0

  CodeListItem:
    slot_usage:
      aliases:
        maximum_cardinality: 0
      other:
        maximum_cardinality: 0

  Standard:
    slot_usage:
      version:
        required: true
    rules:
      - description: Publishing set is required for CT type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: CT
        postconditions:
          slot_conditions:
            name:
              pattern: "^CDISC/NCI$"
            publishingSet:
              required: true
            version:
              pattern: "^20\\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"

  DocumentReference:
    slot_usage:
      relationship:
        maximum_cardinality: 0
    attributes:
      type:
        description: Type of the document reference
        range: TypeDocumentReference
        slot_uri: ddsp:type
        annotations:
          dds.profile.extension: true
      firstPage:
        description: Reference to the first page in a PDF document
        range: integer
        slot_uri: ddsp:firstPage
        annotations:
          dds.profile.extension: true
      lastPage:
        description: Reference to the last page in a PDF document
        range: integer
        slot_uri: ddsp:lastPage
        annotations:
          dds.profile.extension: true
      destination:
        description: Destination of the document reference
        range: string
        slot_uri: ddsp:destination
        annotations:
          dds.profile.extension: true

    rules:
      - description: Publishing set is required for CT type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: NamedDestination
        postconditions:
          slot_conditions:
            destination:
              required: true
            pages:
              maximum_cardinality: 0
            firstPage:
              maximum_cardinality: 0
            lastPage:
              maximum_cardinality: 0

      - description: Publishing set is required for CT type standards.
        preconditions:
          slot_conditions:
            type:
              equals_string: PhysicalRef
        postconditions:
          slot_conditions:
            destination:
              maximum_cardinality: 0

      - description: If Pages is given, FirstPage/LastPage do not apply.
        preconditions:
          slot_conditions:
            pages:
              required: true
        postconditions:
          slot_conditions:
            firstPage:
              maximum_cardinality: 0
            lastPage:
              maximum_cardinality: 0

      - description: If FirstPage or LastPage is given, Pages does not apply.
        preconditions:
          any_of:
            - slot_conditions:
                firstPage:
                  required: true
            - slot_conditions:
                lastPage:
                  required: true
        postconditions:
          slot_conditions:
            pages:
              maximum_cardinality: 0

      - description: FirstPage and LastPage must be given together.
        bidirectional: true
        preconditions:
          slot_conditions:
            firstPage:
              required: true
        postconditions:
          slot_conditions:
            lastPage:
              required: true

  Analysis:
    slot_usage:
      inputData:
        range: ItemGroup              

enums:

  DefineDataType:
    description: ODM data types permitted in Define-XML v2.1.
    permissible_values:
      text: {}
      integer: {}
      float: {}
      date: {}
      time: {}
      datetime: {}
      durationDatetime: {}

  DefineCodeListDataType:
    description: ODM data types permitted for CodeList in Define-XML v2.1.
    permissible_values:
      text: {}
      integer: {}
      float: {}

  DefineOriginType:
    description: Origin types permitted in Define-XML v2.1.
    permissible_values:
      Assigned:    { meaning: NCIT:C170547 }
      Collected:   { meaning: NCIT:C170548 }
      Derived:     { meaning: NCIT:C170549 }
      Predecessor: { meaning: NCIT:C170550 }
      Protocol:    { meaning: NCIT:C170551 }

  DefineMethodType:
    description: Method types permitted in Define-XML v2.1.
    permissible_values:
      Computation: {}
      Imputation: {}

  TypeDocumentReference:
    description: Types of document references permitted in Define-XML v2.1.
    enum_uri: ddsp:TypeDocumentReference
    annotations:
      dds.profile.extension: true
    permissible_values:
      PhysicalRef: {}
      NamedDestination: {}